<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MotionBlock</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <h1>MotionBlock</h1>
          <p id="siteLabel">Loading site...</p>
        </div>
        <button id="openOptions" type="button" class="options-button">Options</button>
      </header>

      <section class="summary" aria-live="polite">
        <span id="statusBadge" class="status">On</span>
        <p id="effectiveSummary">Checking active rules...</p>
      </section>

      <section class="quick-actions">
        <button id="blockMotionHere" type="button" class="primary">Block motion here</button>
        <button id="allowSite" type="button">Allow this site</button>
      </section>

      <section class="section">
        <label class="field">
          <span>Site mode</span>
          <select id="siteEnabled">
            <option value="">Follow global defaults</option>
            <option value="true">Block on this site</option>
            <option value="false">Allow this site</option>
          </select>
        </label>
        <p id="siteRuleNote" class="site-note"></p>
      </section>

      <section class="section">
        <div class="section-title">Site media controls</div>
        <div id="featureList" class="feature-list"></div>
      </section>

      <footer class="footer">
        <button id="resetSite" type="button">Reset site</button>
        <button id="reloadTab" type="button">Reload</button>
      </footer>

      <p id="reloadHint" class="reload-hint" hidden>Reload may be needed for media that was already blocked or loaded.</p>
    </main>

    <script src="shared/config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
